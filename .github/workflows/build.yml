name: Compilar APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK con licencias aceptadas;
      # AGP baja solo la plataforma 37 y las build-tools que falten.

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar debug y release
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: divisas-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Al crear un release (o subir un tag v*), se le adjuntan los APKs y las notas
      - name: Publicar APKs en el release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/divisas-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/divisas-$TAG-debug.apk"
          NOTES=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --title "Divisas $TAG" --notes-file "$NOTES"; fi
          else
            if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
            gh release create "$TAG" dist/*.apk --title "Divisas $TAG" "${ARGS[@]}"
          fi
